name: Build Fetchr

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild monthly so the bundled yt-dlp stays current (sites change often)
  schedule:
    - cron: "0 3 1 * *"

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython setuptools

      - name: Cache Buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        shell: bash
        run: buildozer android debug < <(yes) 2>&1 | tee build.log

      - name: Show Android error
        if: failure()
        shell: bash
        run: |
          echo "===== Lines mentioning errors ====="
          grep -n -E "error:|Error:|ERROR|Traceback|BuildozerException|Command failed" build.log | grep -v "noexcept\|deprecated" | tail -n 40 || true
          echo
          echo "===== Last 120 lines ====="
          tail -n 120 build.log

      - name: Save full Android log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        with:
          name: Fetchr-Android-APK
          path: bin/*.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt imageio-ffmpeg pyinstaller

      - name: Build EXE
        # The build server has no graphics card. Kivy's "mock" graphics mode stops it
        # from opening a blocking error popup while packaging. The finished .exe still
        # uses normal OpenGL on real PCs.
        env:
          KIVY_GL_BACKEND: mock
        run: pyinstaller fetchr-windows.spec --noconfirm --clean

      - uses: actions/upload-artifact@v5
        with:
          name: Fetchr-Windows-EXE
          path: dist/Fetchr.exe
