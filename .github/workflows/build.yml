name: Build Fetchr

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild monthly so the bundled yt-dlp stays current (sites change often)
  schedule:
    - cron: "0 3 1 * *"

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer cython setuptools

      - name: Cache Buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: yes | buildozer android debug

      - uses: actions/upload-artifact@v5
        with:
          name: Fetchr-Android-APK
          path: bin/*.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_CONSOLELOG: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt imageio-ffmpeg pyinstaller

      - name: Build EXE
        run: pyinstaller fetchr-windows.spec --noconfirm --clean

      - uses: actions/upload-artifact@v5
        with:
          name: Fetchr-Windows-EXE
          path: dist/Fetchr.exe
